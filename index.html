<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7b4bb7" />
  <title>도담이의 포도송이 루틴</title>
  <style>
    :root{
      --bg:#fff9f2;
      --card:#ffffff;
      --text:#2f2934;
      --muted:#7d7484;
      --purple:#7b4bb7;
      --purple2:#9b68d2;
      --purple3:#c9afe8;
      --green:#5f9f55;
      --line:#ece4f2;
      --gold:#f2b134;
      --danger:#d35f67;
      --shadow:0 12px 30px rgba(87,56,112,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at top left, #f7ebff 0, transparent 36%),
        radial-gradient(circle at bottom right, #fff0cf 0, transparent 38%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:860px;margin:0 auto;padding:22px 16px 48px}
    .hero{
      background:linear-gradient(135deg,#6f3ca7,#9d65d7);
      color:#fff;border-radius:28px;padding:22px 22px 20px;
      box-shadow:var(--shadow);position:relative;overflow:hidden
    }
    .hero:after{
      content:"";position:absolute;width:220px;height:220px;border-radius:50%;
      background:rgba(255,255,255,.08);right:-70px;top:-90px
    }
    .hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;position:relative;z-index:1}
    .eyebrow{font-size:13px;opacity:.84;margin-bottom:6px}
    h1{font-size:27px;line-height:1.25;margin:0;font-weight:800}
    .date{margin-top:10px;font-size:14px;opacity:.9}
    .gear{
      border:0;background:rgba(255,255,255,.16);color:#fff;width:42px;height:42px;
      border-radius:14px;font-size:20px
    }
    .progress-wrap{margin-top:18px;position:relative;z-index:1}
    .progress-meta{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
    .progress{height:12px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden}
    .bar{height:100%;width:0;background:#fff;border-radius:999px;transition:.35s ease}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
    .card{
      background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);
      border-radius:24px;padding:20px;box-shadow:var(--shadow)
    }
    .card h2{font-size:18px;margin:0 0 14px}
    .grape-stage{display:flex;align-items:center;justify-content:center;min-height:320px;position:relative}
    .grape-cluster{position:relative;width:250px;height:290px}
    .stem{
      position:absolute;width:14px;height:74px;background:#7b5b35;border-radius:999px;
      top:4px;left:121px;transform:rotate(8deg)
    }
    .leaf{
      position:absolute;width:74px;height:46px;background:var(--green);border-radius:70% 20% 70% 20%;
      top:20px;left:138px;transform:rotate(18deg);box-shadow:inset 0 -8px 0 rgba(0,0,0,.05)
    }
    .leaf:after{
      content:"";position:absolute;width:48px;height:3px;background:rgba(255,255,255,.35);
      left:10px;top:24px;transform:rotate(-18deg);border-radius:999px
    }
    .grape{
      position:absolute;width:58px;height:58px;border-radius:50%;
      background:#ddd4e4;border:3px solid #eee7f3;
      box-shadow:inset 0 -8px 0 rgba(0,0,0,.04),0 5px 10px rgba(70,45,90,.12);
      transition:.25s ease;display:flex;align-items:center;justify-content:center;
      font-size:20px;color:white;font-weight:800
    }
    .grape.done{
      background:linear-gradient(145deg,var(--purple2),var(--purple));
      border-color:#b995dc;transform:scale(1.04)
    }
    .grape.gold{
      background:linear-gradient(145deg,#ffd66d,#eaa820);
      border-color:#ffe6a7
    }
    .g1{top:70px;left:98px}.g2{top:105px;left:58px}.g3{top:105px;left:138px}
    .g4{top:145px;left:28px}.g5{top:145px;left:98px}.g6{top:145px;left:168px}
    .g7{top:190px;left:62px}.g8{top:190px;left:134px}.g9{top:235px;left:98px}
    .cheer{
      text-align:center;font-weight:800;color:var(--purple);margin-top:-8px;min-height:26px
    }
    .task-list{display:flex;flex-direction:column;gap:10px}
    .task{
      display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
      padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:#fff
    }
    .task.done{background:#faf7fd}
    .check{
      width:28px;height:28px;border-radius:9px;border:2px solid #cbb8dd;background:#fff;
      display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900
    }
    .task.done .check{background:var(--purple);border-color:var(--purple)}
    .task-text{font-weight:700}
    .task.done .task-text{text-decoration:line-through;color:var(--muted)}
    .task-icon{font-size:22px}
    .empty{padding:28px 10px;text-align:center;color:var(--muted);line-height:1.6}
    .actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
    .btn{
      border:0;border-radius:14px;padding:11px 15px;font-weight:800
    }
    .btn-primary{background:var(--purple);color:#fff}
    .btn-soft{background:#f1e8f8;color:var(--purple)}
    .btn-danger{background:#fff0f1;color:var(--danger)}
    .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .day{
      text-align:center;padding:10px 4px;border-radius:14px;background:#f7f2fa;
      border:1px solid var(--line);font-size:12px;color:var(--muted)
    }
    .day strong{display:block;font-size:20px;margin-top:5px;color:#c8b9d2}
    .day.complete{background:#efe3fa;color:var(--purple)}
    .day.complete strong{color:var(--purple)}
    .wide{grid-column:1/-1}
    dialog{
      width:min(92vw,560px);border:0;border-radius:24px;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.25)
    }
    dialog::backdrop{background:rgba(33,21,42,.45);backdrop-filter:blur(3px)}
    .modal{padding:22px}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .modal h3{margin:0;font-size:21px}
    .close{border:0;background:#f3eef6;border-radius:12px;width:38px;height:38px}
    .form-row{display:grid;grid-template-columns:84px 1fr auto;gap:10px;margin-bottom:10px}
    input,select{
      width:100%;padding:11px 12px;border:1px solid #dcd2e3;border-radius:12px;background:#fff
    }
    .icon-select{font-size:20px;text-align:center}
    .mini-del{border:0;background:#fff0f1;color:var(--danger);border-radius:12px;padding:0 12px}
    .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
      background:#2e2533;color:#fff;padding:12px 18px;border-radius:999px;
      opacity:0;pointer-events:none;transition:.25s;z-index:20
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
    .piece{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 1.8s linear forwards}
    @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.85}}
    @media(max-width:700px){
      .grid{grid-template-columns:1fr}
      .grape-stage{min-height:300px}
      .card{padding:17px}
      h1{font-size:24px}
      .week{gap:5px}
      .day{padding:9px 2px}
      .form-row{grid-template-columns:72px 1fr auto}
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">오늘도 한 알씩 차근차근</div>
          <h1>도담이의 포도송이 루틴</h1>
          <div class="date" id="todayText"></div>
        </div>
        <button class="gear" id="openSettings" aria-label="할 일 설정">⚙️</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span>오늘의 완성도</span>
          <strong id="progressText">0 / 0</strong>
        </div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>
    </section>

    <main class="grid">
      <section class="card">
        <h2>오늘의 포도송이</h2>
        <div class="grape-stage">
          <div class="grape-cluster" id="cluster">
            <div class="stem"></div><div class="leaf"></div>
          </div>
        </div>
        <div class="cheer" id="cheer"></div>
      </section>

      <section class="card">
        <h2>오늘 할 일</h2>
        <div class="task-list" id="taskList"></div>
        <div class="actions">
          <button class="btn btn-soft" id="resetToday">오늘 체크 초기화</button>
          <button class="btn btn-primary" id="openSettings2">할 일 바꾸기</button>
        </div>
      </section>

      <section class="card wide">
        <h2>이번 주 포도밭</h2>
        <div class="week" id="weekView"></div>
      </section>
    </main>
  </div>

  <dialog id="settingsDialog">
    <div class="modal">
      <div class="modal-head">
        <h3>오늘 할 일 설정</h3>
        <button class="close" id="closeSettings">✕</button>
      </div>
      <div id="taskEditor"></div>
      <button class="btn btn-soft" id="addTask">＋ 할 일 추가</button>
      <div class="modal-foot">
        <button class="btn btn-soft" id="cancelSettings">취소</button>
        <button class="btn btn-primary" id="saveSettings">저장하기</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
  <div class="confetti" id="confetti"></div>

  <script>
    const DEFAULT_TASKS = [
      {id: crypto.randomUUID(), icon:"🎒", text:"학교 가방 정리하기"},
      {id: crypto.randomUUID(), icon:"📚", text:"책 20분 읽기"},
      {id: crypto.randomUUID(), icon:"✏️", text:"오늘 공부 끝내기"},
      {id: crypto.randomUUID(), icon:"🪢", text:"줄넘기 또는 몸 움직이기"},
      {id: crypto.randomUUID(), icon:"🧸", text:"내 물건 제자리 정리하기"},
      {id: crypto.randomUUID(), icon:"🪥", text:"양치하고 잠자리 준비하기"}
    ];
    const ICONS = ["🎒","📚","✏️","🧮","🪢","🧸","🪥","🧹","🎨","🎵","💬","⭐"];

    const $ = s => document.querySelector(s);
    const keyDate = (d=new Date()) => {
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    };
    const todayKey = keyDate();

    let tasks = JSON.parse(localStorage.getItem("dodam_tasks") || "null") || DEFAULT_TASKS;
    let records = JSON.parse(localStorage.getItem("dodam_records") || "{}");
    if(!records[todayKey]) records[todayKey] = {done:[], completed:false};

    function saveAll(){
      localStorage.setItem("dodam_tasks", JSON.stringify(tasks));
      localStorage.setItem("dodam_records", JSON.stringify(records));
    }

    function renderDate(){
      const d = new Date();
      const weekdays=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
      $("#todayText").textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${weekdays[d.getDay()]}`;
    }

    function renderTasks(){
      const box=$("#taskList");
      box.innerHTML="";
      if(tasks.length===0){
        box.innerHTML='<div class="empty">아직 할 일이 없어요.<br>할 일을 추가해 주세요.</div>';
        return;
      }
      const doneSet = new Set(records[todayKey].done);
      tasks.forEach(t=>{
        const row=document.createElement("div");
        row.className="task"+(doneSet.has(t.id)?" done":"");
        row.innerHTML=`
          <button class="check" aria-label="완료 체크">${doneSet.has(t.id)?"✓":""}</button>
          <div class="task-text">${escapeHtml(t.text)}</div>
          <div class="task-icon">${t.icon}</div>`;
        row.querySelector(".check").onclick=()=>toggleTask(t.id);
        box.appendChild(row);
      });
    }

    function renderGrapes(){
      const cluster=$("#cluster");
      cluster.querySelectorAll(".grape").forEach(el=>el.remove());
      const count=Math.min(Math.max(tasks.length,1),9);
      const doneCount=records[todayKey].done.filter(id=>tasks.some(t=>t.id===id)).length;
      for(let i=0;i<count;i++){
        const g=document.createElement("div");
        g.className=`grape g${i+1}`+(i<doneCount?" done":"");
        g.textContent=i<doneCount?"✓":"";
        cluster.appendChild(g);
      }
      const total=tasks.length;
      const pct=total?Math.round(doneCount/total*100):0;
      $("#progressText").textContent=`${doneCount} / ${total}`;
      $("#progressBar").style.width=pct+"%";
      $("#cheer").textContent = total && doneCount===total ? "🍇 오늘의 포도송이 완성!" : doneCount ? "좋아! 한 알씩 채우고 있어요." : "첫 번째 포도알부터 시작해 볼까요?";
    }

    function renderWeek(){
      const box=$("#weekView");
      box.innerHTML="";
      const names=["일","월","화","수","목","금","토"];
      const now=new Date();
      const start=new Date(now);
      start.setDate(now.getDate()-now.getDay());
      for(let i=0;i<7;i++){
        const d=new Date(start); d.setDate(start.getDate()+i);
        const k=keyDate(d);
        const complete=records[k]?.completed;
        const item=document.createElement("div");
        item.className="day"+(complete?" complete":"");
        item.innerHTML=`${names[d.getDay()]}<strong>${complete?"🍇":"○"}</strong>${d.getDate()}일`;
        box.appendChild(item);
      }
    }

    function renderAll(){
      renderDate(); renderTasks(); renderGrapes(); renderWeek(); saveAll();
    }

    function toggleTask(id){
      const list=records[todayKey].done;
      const i=list.indexOf(id);
      if(i>=0) list.splice(i,1); else list.push(id);
      const wasCompleted=records[todayKey].completed;
      records[todayKey].completed = tasks.length>0 && tasks.every(t=>list.includes(t.id));
      renderAll();
      if(records[todayKey].completed && !wasCompleted){
        celebrate();
        toast("오늘 포도송이를 완성했어요!");
      }
    }

    function openSettings(){
      renderEditor();
      $("#settingsDialog").showModal();
    }

    function renderEditor(){
      const box=$("#taskEditor");
      box.innerHTML="";
      tasks.forEach((t,index)=>{
        const row=document.createElement("div");
        row.className="form-row";
        const options=ICONS.map(ic=>`<option value="${ic}" ${ic===t.icon?"selected":""}>${ic}</option>`).join("");
        row.innerHTML=`
          <select class="icon-select" data-index="${index}">${options}</select>
          <input data-index="${index}" value="${escapeAttr(t.text)}" maxlength="30" />
          <button class="mini-del" data-index="${index}">삭제</button>`;
        row.querySelector(".mini-del").onclick=()=>{
          tasks.splice(index,1); renderEditor();
        };
        box.appendChild(row);
      });
    }

    $("#addTask").onclick=()=>{
      if(tasks.length>=9){ toast("포도알은 최대 9개까지 만들 수 있어요."); return; }
      tasks.push({id:crypto.randomUUID(),icon:"⭐",text:"새로운 할 일"});
      renderEditor();
    };

    $("#saveSettings").onclick=()=>{
      const rows=[...document.querySelectorAll(".form-row")];
      rows.forEach((row,i)=>{
        tasks[i].icon=row.querySelector("select").value;
        tasks[i].text=row.querySelector("input").value.trim() || "할 일";
      });
      records[todayKey].done = records[todayKey].done.filter(id=>tasks.some(t=>t.id===id));
      records[todayKey].completed = tasks.length>0 && tasks.every(t=>records[todayKey].done.includes(t.id));
      $("#settingsDialog").close();
      renderAll(); toast("할 일을 저장했어요.");
    };

    $("#resetToday").onclick=()=>{
      if(confirm("오늘 체크한 내용을 모두 지울까요?")){
        records[todayKey]={done:[],completed:false}; renderAll(); toast("오늘 체크를 초기화했어요.");
      }
    };

    function celebrate(){
      const wrap=$("#confetti");
      wrap.innerHTML="";
      const colors=["#7b4bb7","#f2b134","#5f9f55","#e86b7d","#6a9ee8"];
      for(let i=0;i<70;i++){
        const p=document.createElement("span");
        p.className="piece";
        p.style.left=Math.random()*100+"vw";
        p.style.background=colors[Math.floor(Math.random()*colors.length)];
        p.style.animationDelay=(Math.random()*.7)+"s";
        p.style.transform=`rotate(${Math.random()*360}deg)`;
        wrap.appendChild(p);
      }
      setTimeout(()=>wrap.innerHTML="",2600);
    }

    function toast(msg){
      const t=$("#toast"); t.textContent=msg; t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"),1800);
    }

    function escapeHtml(s){
      return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
    }
    function escapeAttr(s){ return escapeHtml(s); }

    $("#openSettings").onclick=openSettings;
    $("#openSettings2").onclick=openSettings;
    $("#closeSettings").onclick=()=>$("#settingsDialog").close();
    $("#cancelSettings").onclick=()=>$("#settingsDialog").close();
    $("#settingsDialog").addEventListener("click",e=>{
      const r=$("#settingsDialog").getBoundingClientRect();
      if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) $("#settingsDialog").close();
    });

    renderAll();
  </script>
</body>
</html>
